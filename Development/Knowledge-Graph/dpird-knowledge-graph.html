// ── Canvas setup ─────────────────────────────────────────────────────
const canvas = document.getElementById('graph');
const ctx    = canvas.getContext('2d');

let W, H, DPR;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const wrap = canvas.parentElement;
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);
  initPositions();
}

window.addEventListener('resize', resize);

// ── Simulation ───────────────────────────────────────────────────────
const nodes = SESSION_DATA.nodes.map(d => ({ ...d, x:0, y:0, vx:0, vy:0 }));
const edges = SESSION_DATA.edges;
const nodeMap = {};
nodes.forEach(n => { nodeMap[n.id] = n; });

// Build adjacency set for highlighting
const neighborSet = {};
nodes.forEach(n => { neighborSet[n.id] = new Set(); });
edges.forEach(e => {
  neighborSet[e.source].add(e.target);
  neighborSet[e.target].add(e.source);
});

function initPositions() {
  // Circular/radial layout by type
  const cx = W / 2, cy = H / 2;
  const groups = {
    response: [], tag: [], grant: [], provider: []
  };
  nodes.forEach(n => groups[n.type]?.push(n));

  // Radii for each ring — expanded layout
  const radii = {
    response: Math.min(W, H) * 0.22,
    tag:      Math.min(W, H) * 0.35,
    grant:    Math.min(W, H) * 0.42,
    provider: Math.min(W, H) * 0.42
  };

  const placeRing = (group, radius) => {
    const n = group.length;
    group.forEach((node, i) => {
      const angle = (i / n) * Math.PI * 2 - Math.PI / 2 + (Math.random()-.5)*0.3;
      node.x = cx + Math.cos(angle) * radius + (Math.random()-.5)*10;
      node.y = cy + Math.sin(angle) * radius + (Math.random()-.5)*10;
      node.vx = 0; node.vy = 0;
    });
  };

  placeRing(groups.response, radii.response);
  placeRing(groups.tag,      radii.tag);
  // Split grants and providers on opposite sides for clarity
  groups.grant.forEach((node, i) => {
    const n = groups.grant.length;
    const angle = (i / n) * Math.PI - Math.PI / 2 + (Math.random()-.5)*0.2;
    node.x = cx + Math.cos(angle) * radii.grant + (Math.random()-.5)*10;
    node.y = cy + Math.sin(angle) * radii.grant + (Math.random()-.5)*10;
    node.vx = 0; node.vy = 0;
  });
  groups.provider.forEach((node, i) => {
    const n = groups.provider.length;
    const angle = Math.PI + (i / n) * Math.PI - Math.PI / 2 + (Math.random()-.5)*0.2;
    node.x = cx + Math.cos(angle) * radii.provider + (Math.random()-.5)*10;
    node.y = cy + Math.sin(angle) * radii.provider + (Math.random()-.5)*10;
    node.vx = 0; node.vy = 0;
  });
}

const REPULSION    = 3000;
const SPRING_K     = 0.04;
const REST_LEN     = 100;
const DAMPING      = 0.82;
const GRAVITY      = 0.0008;
const BORDER_PAD   = 40;

let alpha = 1.0;

function tick() {
  if (dragNode) return; // pause sim while dragging
  if (alpha < 0.001) { alpha = 0; return; }

  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx*dx + dy*dy || 1;
      const d  = Math.sqrt(d2);
      const f  = (REPULSION / d2) * alpha;
      const fx = (dx/d)*f, fy = (dy/d)*f;
      a.vx -= fx; a.vy -= fy;
      b.vx += fx; b.vy += fy;
    }
  }

  // Springs
  edges.forEach(e => {
    const a = nodeMap[e.source], b = nodeMap[e.target];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 1;
    const f  = SPRING_K * (d - REST_LEN) * alpha;
    const fx = (dx/d)*f, fy = (dy/d)*f;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });

  // Center gravity + boundary
  nodes.forEach(n => {
    n.vx += (W/2 - n.x) * GRAVITY;
    n.vy += (H/2 - n.y) * GRAVITY;
    n.vx *= DAMPING;
    n.vy *= DAMPING;
    n.x  += n.vx;
    n.y  += n.vy;
    // Boundary
    const pad = n.radius + BORDER_PAD;
    if (n.x < pad)   { n.x = pad;   n.vx *= -0.3; }
    if (n.x > W-pad) { n.x = W-pad; n.vx *= -0.3; }
    if (n.y < pad)   { n.y = pad;   n.vy *= -0.3; }
    if (n.y > H-pad) { n.y = H-pad; n.vy *= -0.3; }
  });

  alpha *= 0.994;
}

// ── Theme detection ──────────────────────────────────────────────────
function isDark() {
  const th = document.documentElement.dataset.theme;
  if (th === 'dark')  return true;
  if (th === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function theme() {
  return isDark() ? {
    bg:       '#090f1c',
    surface:  '#1a2438',
    edge:     'rgba(148,163,184,0.14)',
    edgeHi:   'rgba(148,163,184,0.55)',
    label:    '#94a3b8',
    labelHi:  '#e2e8f0',
    nodeStroke:'rgba(0,0,0,0.4)',
    glow: true
  } : {
    bg:       '#eef2f8',
    surface:  '#ffffff',
    edge:     'rgba(30,50,80,0.12)',
    edgeHi:   'rgba(30,50,80,0.45)',
    label:    '#64748b',
    labelHi:  '#0f172a',
    nodeStroke:'rgba(255,255,255,0.6)',
    glow: false
  };
}

// ── Render ───────────────────────────────────────────────────────────
let hoveredNode = null;
let selectedNode = null;

function drawGlow(x, y, r, color) {
  // Subtle glow for minimalist aesthetic
  const g = ctx.createRadialGradient(x, y, r*0.5, x, y, r*1.8);
  g.addColorStop(0, color + '22');
  g.addColorStop(1, color + '00');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r*1.8, 0, Math.PI*2);
  ctx.fill();
}

function drawArrow(x1, y1, x2, y2, r2) {
  const angle = Math.atan2(y2-y1, x2-x1);
  const ex = x2 - Math.cos(angle)*r2;
  const ey = y2 - Math.sin(angle)*r2;
  const aw = 5, al = 8;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex - al*Math.cos(angle) + aw*Math.sin(angle),
             ey - al*Math.sin(angle) - aw*Math.cos(angle));
  ctx.lineTo(ex - al*Math.cos(angle) - aw*Math.sin(angle),
             ey - al*Math.sin(angle) + aw*Math.cos(angle));
  ctx.closePath();
  ctx.fill();
}

function wrapText(text, maxW, lineH) {
  // Returns array of lines
  const words = text.split('\n');
  return words; // we use \n in labels directly
}

function render() {
  const T = theme();
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = T.bg;
  ctx.fillRect(0, 0, W, H);

  const activeId = hoveredNode?.id || selectedNode?.id;

  // ── Edges
  edges.forEach(e => {
    const a = nodeMap[e.source], b = nodeMap[e.target];
    if (!a || !b) return;

    const isActive = activeId &&
      (a.id === activeId || b.id === activeId ||
       neighborSet[activeId]?.has(a.id) && neighborSet[activeId]?.has(b.id));

    const dimmed = activeId && !isActive;
    const alpha  = dimmed ? 0.08 : 1;

    ctx.globalAlpha = alpha;

    const lw = 0.5 + e.weight * 1.8;
    ctx.lineWidth = lw;
    ctx.strokeStyle = isActive ? T.edgeHi : T.edge;

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    // Arrow tip toward target
    ctx.fillStyle = isActive ? T.edgeHi : T.edge;
    drawArrow(a.x, a.y, b.x, b.y, b.radius + 2);

    ctx.globalAlpha = 1;
  });

  // ── Nodes + Labels
  nodes.forEach(n => {
    const isHovered  = hoveredNode === n;
    const isSelected = selectedNode === n;
    const isNeighbor = activeId && neighborSet[activeId]?.has(n.id);
    const isActive   = n.id === activeId || isNeighbor;
    const dimmed     = activeId && !isActive;

    ctx.globalAlpha = dimmed ? 0.18 : 1;

    const r = n.radius * (isHovered || isSelected ? 1.18 : 1);

    // Glow (dark theme only)
    if (T.glow && isActive) {
      drawGlow(n.x, n.y, r, n.color);
    }

    // Node circle
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    ctx.fillStyle = n.color;
    ctx.fill();

    // Stroke ring
    ctx.lineWidth = isSelected ? 2.5 : 1.5;
    ctx.strokeStyle = isSelected ? '#ffffff' : T.nodeStroke;
    ctx.stroke();

    // Score ring for grants/providers
    if ((n.type === 'grant' || n.type === 'provider') && n.score) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 5, -Math.PI/2, -Math.PI/2 + Math.PI*2*n.score);
      ctx.strokeStyle = n.color + 'aa';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Label
    const lines = n.label.split('\n');
    const labelY = n.y + r + 10;
    ctx.font = `${isActive ? 500 : 400} 10.5px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = isActive ? T.labelHi : T.label;

    lines.forEach((line, i) => {
      ctx.fillText(line, n.x, labelY + i * 13);
    });

    ctx.globalAlpha = 1;
  });
}

// ── Interaction ──────────────────────────────────────────────────────
let dragNode = null;
let dragOffX = 0, dragOffY = 0;

function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX ?? e.touches?.[0].clientX) - rect.left,
    y: (e.clientY ?? e.touches?.[0].clientY) - rect.top
  };
}

function hitTest(mx, my) {
  // Reverse order — top node first
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const d = Math.hypot(mx - n.x, my - n.y);
    if (d <= n.radius + 4) return n;
  }
  return null;
}

canvas.addEventListener('mousemove', e => {
  const { x, y } = getMousePos(e);
  if (dragNode) {
    dragNode.x = x + dragOffX;
    dragNode.y = y + dragOffY;
    dragNode.vx = 0; dragNode.vy = 0;
    alpha = 0.3;
    canvas.classList.add('dragging');
    return;
  }
  const hit = hitTest(x, y);
  hoveredNode = hit;
  canvas.classList.toggle('hovering', !!hit);
  canvas.classList.remove('dragging');
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode = null;
  canvas.classList.remove('hovering', 'dragging');
});

canvas.addEventListener('mousedown', e => {
  const { x, y } = getMousePos(e);
  const hit = hitTest(x, y);
  if (hit) {
    dragNode = hit;
    dragOffX = hit.x - x;
    dragOffY = hit.y - y;
  }
});

canvas.addEventListener('mouseup', e => {
  const { x, y } = getMousePos(e);
  const wasDragging = dragNode &&
    (Math.abs(dragNode.x - (x + dragOffX)) > 4 ||
     Math.abs(dragNode.y - (y + dragOffY)) > 4);

  if (dragNode && !wasDragging) {
    // It's a click
    openPanel(dragNode);
  }
  dragNode = null;
  canvas.classList.remove('dragging');
});

canvas.addEventListener('click', e => {
  const { x, y } = getMousePos(e);
  const hit = hitTest(x, y);
  if (!hit) {
    closePanel();
  }
});

// ── Panel ─────────────────────────────────────────────────────────────
const panel    = document.getElementById('panel');
const closeBtn = document.getElementById('close-btn');
const panelBadge = document.getElementById('panel-badge');
const panelTitle = document.getElementById('panel-title');
const panelBody  = document.getElementById('panel-body');

const TYPE_LABELS = {
  response: 'Response',
  tag:      'Tag',
  grant:    'Grant',
  provider: 'Provider',
  resource: 'Resource'
};

const DIM_COLORS = {
  Operations: '#3b82f6',
  Digital:    '#8b5cf6',
  Market:     '#f59e0b',
  Profile:    '#64748b'
};

function openPanel(node) {
  selectedNode = node;

  // Badge
  panelBadge.textContent = TYPE_LABELS[node.type] || node.type;
  panelBadge.style.background = node.color + '22';
  panelBadge.style.color = node.color;

  panelTitle.textContent = node.label.replace(/\n/g, ' ');

  // Body
  let html = '';

  if (node.type === 'response') {
    const dc = DIM_COLORS[node.dimension] || '#64748b';
    html += `
      <div>
        <div class="panel-section-label">Dimension</div>
        <span class="dim-badge" style="background:${dc}22;color:${dc}">
          ${node.dimension}
        </span>
      </div>
      <div>
        <div class="panel-section-label">Answer detail</div>
        <div class="panel-value">${node.detail}</div>
      </div>
    `;
    // Show connected tags
    const connectedTags = edges
      .filter(e => e.source === node.id)
      .map(e => nodeMap[e.target]?.label?.replace(/\n/g,' '))
      .filter(Boolean);
    if (connectedTags.length) {
      html += `
        <div>
          <div class="panel-section-label">Tags activated</div>
          <div class="tag-list">
            ${connectedTags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
          </div>
        </div>
      `;
    }
  }

  if (node.type === 'tag') {
    html += `
      <div>
        <div class="panel-section-label">Description</div>
        <div class="panel-value">${node.detail}</div>
      </div>
    `;
    const sources = edges
      .filter(e => e.target === node.id)
      .map(e => nodeMap[e.source]?.label?.replace(/\n/g,' '))
      .filter(Boolean);
    const targets = edges
      .filter(e => e.source === node.id)
      .map(e => nodeMap[e.target]?.label?.replace(/\n/g,' '))
      .filter(Boolean);
    if (sources.length) {
      html += `
        <div>
          <div class="panel-section-label">Activated by</div>
          <div class="tag-list">${sources.map(s => `<span class="tag-chip">${s}</span>`).join('')}</div>
        </div>
      `;
    }
    if (targets.length) {
      html += `
        <div>
          <div class="panel-section-label">Matched to</div>
          <div class="tag-list">${targets.map(t => `<span class="tag-chip">${t}</span>`).join('')}</div>
        </div>
      `;
    }
  }

  if (node.type === 'grant' || node.type === 'provider') {
    const pct = Math.round(node.score * 100);
    html += `
      <div>
        <div class="panel-section-label">Match score</div>
        <div class="score-bar-wrap">
          <div class="score-bar-bg">
            <div class="score-bar-fill"
              style="width:${pct}%;background:${node.color}"></div>
          </div>
          <span class="score-val">${pct}%</span>
        </div>
      </div>
    `;
    if (node.matchedTags?.length) {
      html += `
        <div>
          <div class="panel-section-label">Matched tags</div>
          <div class="tag-list">
            ${node.matchedTags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
          </div>
        </div>
      `;
    }
    html += `
      <div>
        <div class="panel-section-label">Reasoning path</div>
        <div class="reasoning-text">${node.reasoning}</div>
      </div>
    `;
  }

  panelBody.innerHTML = html;
  panel.classList.add('open');
}

function closePanel() {
  panel.classList.remove('open');
  selectedNode = null;
}

closeBtn.addEventListener('click', closePanel);

// ── Loop ──────────────────────────────────────────────────────────────
function loop() {
  tick();
  render();
  requestAnimationFrame(loop);
}

// ── Boot ──────────────────────────────────────────────────────────────
resize();
loop();
</script>
